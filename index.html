<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/192x192.png" />
  <link rel="apple-touch-icon" href="/192x192.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <title>
    Punjab University Gujranwala Campus — BS Computer Science (2024-2028)
  </title>

  <meta name="theme-color" content="#4f46e5" />

  <meta name="mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('pugc_theme_preference');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (stored === 'dark' || (!stored && prefersDark) || (stored === 'system' && prefersDark)) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.toggle('dark', theme === 'dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b0f19' : '#4f46e5');
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root">
    <div style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          margin: 0;
          font-family:
            system-ui,
            -apple-system,
            sans-serif;
          background: #f8fafc;
          color: #1e293b;
          text-align: center;
          padding: 2rem;
        ">
      <h1 style="
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 0.5rem;
            color: #1e3a5f;
          ">
        Punjab University Gujranwala Campus
      </h1>
      <p style="
            font-size: 1.25rem;
            font-weight: 500;
            margin: 0 0 0.25rem;
            color: #475569;
          ">
        BS Computer Science
      </p>
      <p style="font-size: 1rem; font-weight: 400; margin: 0; color: #64748b">
        2024-2028
      </p>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
